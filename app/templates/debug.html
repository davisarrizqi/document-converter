<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Converter API Tester</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #0b1220;
      color: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(145deg, #0b1220, #111827); }
    main { width: min(1100px, calc(100% - 32px)); margin: 40px auto; }
    h1 { margin-bottom: 6px; font-size: 2rem; }
    .subtitle { color: #94a3b8; margin-top: 0; }
    .panel { border: 1px solid #334155; border-radius: 14px; background: #111827; padding: 22px; box-shadow: 0 18px 50px #02061766; }
    .request-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; }
    .mode-row { display: flex; flex-wrap: wrap; gap: 18px; margin: 20px 0; }
    label { color: #cbd5e1; font-weight: 600; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea { width: 100%; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #f8fafc; padding: 11px 12px; }
    textarea { min-height: 170px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    button { border: 0; border-radius: 8px; padding: 11px 18px; cursor: pointer; font-weight: 700; }
    .primary { color: white; background: #2563eb; }
    .secondary { color: #dbeafe; background: #1e3a5f; margin-left: 8px; }
    button:disabled { cursor: wait; opacity: .6; }
    .field { margin-top: 16px; }
    .hidden { display: none; }
    .quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
    .quick button { color: #bfdbfe; background: #172554; }
    .result { margin-top: 18px; }
    .result-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .status { color: #86efac; font-weight: 700; }
    .status.error { color: #fca5a5; }
    pre { min-height: 80px; overflow: auto; white-space: pre-wrap; word-break: break-word; border-radius: 8px; background: #020617; color: #dbeafe; padding: 16px; }
    a.download { display: inline-block; margin-top: 10px; color: #93c5fd; font-weight: 700; }
    .hint { color: #64748b; font-size: .88rem; margin-top: 7px; }
    @media (max-width: 720px) {
      .request-row { grid-template-columns: 1fr; }
      .primary { width: 100%; }
      main { margin: 20px auto; }
    }
  </style>
</head>
<body>
  <main>
    <h1>API Tester</h1>
    <p class="subtitle">Send JSON or multipart requests, inspect responses, and download converted files.</p>
    <section class="panel">
      <div class="quick" aria-label="Quick requests">
        <button type="button" data-path="/api/v1/health" data-method="GET" data-mode="none">Health</button>
        <button type="button" data-path="/api/v1/documents" data-method="GET" data-mode="none">List documents</button>
        <button type="button" data-path="/api/v1/conversions" data-method="GET" data-mode="none">List conversions</button>
        <button type="button" data-path="/api/v1/convert" data-method="POST" data-mode="multipart">Direct convert</button>
      </div>

      <form id="request-form">
        <div class="request-row">
          <select id="method" aria-label="HTTP method">
            <option>GET</option><option selected>POST</option><option>PUT</option><option>DELETE</option>
          </select>
          <input id="path" value="/api/v1/convert" aria-label="Request path" required>
          <button class="primary" id="send" type="submit">Send request</button>
        </div>

        <div class="mode-row">
          <label><input type="radio" name="body-mode" value="none"> No body</label>
          <label><input type="radio" name="body-mode" value="json"> JSON</label>
          <label><input type="radio" name="body-mode" value="multipart" checked> Multipart file</label>
        </div>

        <div id="json-fields" class="hidden field">
          <label for="json-body">JSON body</label>
          <textarea id="json-body">{&#10;  "document_id": "DOCUMENT_ID",&#10;  "target_format": "docx"&#10;}</textarea>
        </div>

        <div id="multipart-fields" class="field">
          <label for="file">File</label>
          <input id="file" type="file" accept=".pdf,.docx">
          <div class="field">
            <label for="output">Direct conversion output</label>
            <select id="output">
              <option value="link">link</option>
              <option value="file">file</option>
            </select>
            <div class="hint">For other multipart endpoints, only the file field is sent.</div>
          </div>
        </div>
      </form>

      <div class="result">
        <div class="result-head">
          <h2>Response</h2>
          <span id="status" class="status"></span>
        </div>
        <pre id="response">Ready.</pre>
        <a id="download" class="download hidden" href="#">Download response file</a>
      </div>
    </section>
  </main>
  <script>
    const form = document.querySelector("#request-form");
    const method = document.querySelector("#method");
    const path = document.querySelector("#path");
    const jsonFields = document.querySelector("#json-fields");
    const multipartFields = document.querySelector("#multipart-fields");
    const send = document.querySelector("#send");
    const status = document.querySelector("#status");
    const response = document.querySelector("#response");
    const download = document.querySelector("#download");
    let downloadUrl = null;

    function selectedMode() {
      return document.querySelector('input[name="body-mode"]:checked').value;
    }

    function updateFields() {
      const mode = selectedMode();
      jsonFields.classList.toggle("hidden", mode !== "json");
      multipartFields.classList.toggle("hidden", mode !== "multipart");
    }

    document.querySelectorAll('input[name="body-mode"]').forEach((radio) => {
      radio.addEventListener("change", updateFields);
    });

    document.querySelectorAll(".quick button").forEach((button) => {
      button.addEventListener("click", () => {
        method.value = button.dataset.method;
        path.value = button.dataset.path;
        document.querySelector(`input[name="body-mode"][value="${button.dataset.mode}"]`).checked = true;
        updateFields();
      });
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      send.disabled = true;
      status.textContent = "Sending...";
      status.classList.remove("error");
      response.textContent = "";
      download.classList.add("hidden");
      if (downloadUrl) URL.revokeObjectURL(downloadUrl);
      downloadUrl = null;

      const mode = selectedMode();
      const options = { method: method.value, headers: {} };
      try {
        if (mode === "json") {
          options.headers["Content-Type"] = "application/json";
          options.body = document.querySelector("#json-body").value;
        } else if (mode === "multipart") {
          const file = document.querySelector("#file").files[0];
          if (!file) throw new Error("Choose a PDF or DOCX file first.");
          const body = new FormData();
          body.append("file", file, file.name);
          if (path.value.startsWith("/api/v1/convert")) {
            body.append("output", document.querySelector("#output").value);
          }
          options.body = body;
        }

        const result = await fetch(path.value, options);
        status.textContent = `${result.status} ${result.statusText}`;
        status.classList.toggle("error", !result.ok);
        const headers = [...result.headers.entries()]
          .map(([name, value]) => `${name}: ${value}`)
          .join("\n");
        const contentType = result.headers.get("content-type") || "";
        if (contentType.includes("application/json") || contentType.startsWith("text/")) {
          const text = await result.text();
          let formatted = text;
          if (contentType.includes("application/json") && text) {
            try { formatted = JSON.stringify(JSON.parse(text), null, 2); } catch (_) {}
          }
          response.textContent = `${headers}\n\n${formatted}`;
        } else {
          const blob = await result.blob();
          const disposition = result.headers.get("content-disposition") || "";
          const match = disposition.match(/filename="?([^";]+)"?/i);
          downloadUrl = URL.createObjectURL(blob);
          download.href = downloadUrl;
          download.download = match ? match[1] : "converted-file";
          download.classList.remove("hidden");
          response.textContent = `${headers}\n\nBinary response (${blob.size} bytes).`;
        }
      } catch (error) {
        status.textContent = "Request failed";
        status.classList.add("error");
        response.textContent = error.message;
      } finally {
        send.disabled = false;
      }
    });

    updateFields();
  </script>
</body>
</html>
