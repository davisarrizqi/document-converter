name: Mirror to GitLab

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Push mirror to GitLab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --mirror "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          git for-each-ref --format='delete %(refname)' refs/pull | git update-ref --stdin
          git push --mirror "https://oauth2:${GITLAB_TOKEN}@gitlab.com/sherliestic/document-converter.git"
